<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>anscinwine</title>
    <meta name="description" content="anscinwine" />
    <meta property="og:title" content="anscinwine" />
    <meta property="og:description" content="anscinwine" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="anscinwine" />
    <meta name="twitter:description" content="anscinwine" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- SVG filter for chromatic liquid glass refraction in supported Chromium browsers -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n" />
        <feGaussianBlur in="n" stdDeviation="2" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="34" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div id="root"></div>

    <script>
      // Enable liquid glass refraction in Chromium
      if (window.chrome) document.documentElement.classList.add('refract');
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
